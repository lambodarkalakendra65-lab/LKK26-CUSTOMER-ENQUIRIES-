<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lambodar Kala Kendra (2026) - Enquiry Manager</title>

  <style>
    :root {
      --primary: #d35400; 
      --secondary: #f39c12; 
      --bg: #fdfaf6; 
      --card-bg: #ffffff;
      --text: #2c3e50;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
    }

    .header {
      text-align: center;
      padding: 20px 0 10px 0;
    }

    .header h1 {
      color: var(--primary);
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    .header p {
      color: var(--secondary);
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 5px;
    }

    .container {
      max-width: 1000px;
      margin: 10px auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(211, 84, 0, 0.12);
      border-top: 5px solid var(--primary);
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #444;
    }

    input[type="text"], input[type="tel"], select {
      width: 100%;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
    }

    input[type="text"]:focus, input[type="tel"]:focus, select:focus {
      border-color: var(--primary);
      outline: none;
    }

    .search-box {
      width: 100%;
      margin-bottom: 20px;
      padding: 12px;
      font-size: 15px;
      border: 2px solid var(--secondary);
      border-radius: 6px;
      box-sizing: border-box;
      background-color: #fffdf9;
    }

    .action-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    button.add-btn {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    button.export-btn {
      background-color: #2980b9;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 8px;
    }

    th, td {
      border: 1px solid #eee;
      padding: 10px 8px;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #fff4e6;
      color: var(--primary);
      font-weight: bold;
    }

    .wa-btn {
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 5px;
      display: inline-block;
      font-weight: bold;
      font-size: 13px;
    }

    .delete-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-eco { background-color: #e8f8f5; color: #117a65; }
    .badge-pop { background-color: #fef9e7; color: #b7950b; }
    
    .date-text {
      color: #7f8c8d;
      font-size: 12px;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🌸 🌺 LAMBODAR KALA KENDRA (2026) 🌺 🌸</h1>
  <p>🚩 Customer Enquiry Record 🚩</p>
</div>

<div class="container">
  <h2>New Enquiry Details</h2>
  
  <form id="enquiryForm">
    <div class="form-group">
      <label for="name">Customer Name:</label>
      <input type="text" id="name" placeholder="e.g., Ramesh Sharma" required>
    </div>

    <div class="form-group">
      <label for="phone">WhatsApp Phone Number (with Country Code):</label>
      <input type="tel" id="phone" placeholder="e.g., 919876543210" required>
    </div>

    <div class="form-group">
      <label for="material">Material Type:</label>
      <select id="material" required>
        <option value="">-- Select Material --</option>
        <option value="Eco-Friendly">Eco-Friendly Clay (Shadu Mati)</option>
        <option value="POP">POP (Plaster of Paris)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="size">Size (in Feet):</label>
      <select id="size" required>
        <option value="">-- Select Size --</option>
        <option value="1ft">1ft</option>
        <option value="1.5ft">1.5ft</option>
        <option value="2.0ft">2.0ft</option>
        <option value="2.5ft">2.5ft</option>
        <option value="3.0ft">3.0ft</option>
        <option value="3.5ft">3.5ft</option>
        <option value="4.0ft">4.0ft</option>
        <option value="4.5ft">4.5ft</option>
        <option value="5.0ft">5.0ft</option>
        <option value="5.5ft">5.5ft</option>
        <option value="6.0ft">6.0ft</option>
        <option value="6.5ft">6.5ft</option>
        <option value="7.0ft">7.0ft</option>
        <option value="8ft">8ft</option>
        <option value="9ft">9ft</option>
        <option value="10ft">10ft</option>
      </select>
    </div>

    <div class="form-group">
      <label for="murtiType">Murti Details / Style / Design:</label>
      <input type="text" id="murtiType" placeholder="e.g., Lalbaugcha Raja Style / Dagdusheth Style" required>
    </div>

    <button type="button" class="add-btn" onclick="addEnquiry()">✨ Save Enquiry</button>
  </form>

  <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">

  <div class="action-header">
    <h3>Saved Customer Enquiries</h3>
    <button class="export-btn" onclick="exportToCSV()">📥 Download Backup (Excel)</button>
  </div>
  
  <input type="text" id="searchInput" class="search-box" onkeyup="filterEnquiries()" placeholder="🔍 Search by Customer Name or Phone Number...">

  <table id="enquiryTable">
    <thead>
      <tr>
        <th>Date</th>
        <th>Customer Name</th>
        <th>Phone Number</th>
        <th>Material</th>
        <th>Size</th>
        <th>Details</th>
        <th>WhatsApp</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      </tbody>
  </table>
</div>

<script>
  document.addEventListener("DOMContentLoaded", loadEnquiries);

  function getSavedEnquiries() {
    const saved = localStorage.getItem("lambodarEnquiries");
    return saved ? JSON.parse(saved) : [];
  }

  function loadEnquiries() {
    const enquiries = getSavedEnquiries();
    renderTable(enquiries);
  }

  function renderTable(dataList) {
    const tableBody = document.querySelector("#enquiryTable tbody");
    tableBody.innerHTML = ""; 

    dataList.forEach((item, index) => {
      const message = `*|| ॐ गं गणपतये नमः ||* 🙏\n\n*LAMBODAR KALA KENDRA (2026)* me aapka swagat hai, ${item.name} ji! 🌸\n\nAapki *Ganesh Murti* ki enquiry ke liye bahut bahut dhanyawad:\n\n📌 *Details:*\n• *Type:* ${item.murtiType}\n• *Size:* ${item.size}\n• *Material:* ${item.material}\n\nHum aapko photo gallery aur price details share kar rahe hain. Agar aapki koi special requirement ya customization request hai, toh zaroor batayein!\n\n_Bappa Morya!_ ✨`;
      
      const encodedMessage = encodeURIComponent(message);
      const waLink = `https://wa.me/${item.phone}?text=${encodedMessage}`;
      const badgeClass = item.material && item.material.includes("Eco") ? "badge-eco" : "badge-pop";

      const newRow = document.createElement("tr");
      newRow.innerHTML = `
        <td class="date-text">${item.dateString}</td>
        <td><strong>${item.name}</strong></td>
        <td>+${item.phone}</td>
        <td><span class="badge ${badgeClass}">${item.material}</span></td>
        <td><strong>${item.size}</strong></td>
        <td>${item.murtiType}</td>
        <td>
          <a href="${waLink}" target="_blank" class="wa-btn">
            💬 Send
          </a>
        </td>
        <td>
          <button class="delete-btn" onclick="deleteEnquiry(${index})">Delete</button>
        </td>
      `;
      tableBody.appendChild(newRow);
    });
  }

  function addEnquiry() {
    const name = document.getElementById("name").value.trim();
    let phone = document.getElementById("phone").value.trim();
    const material = document.getElementById("material").value;
    const size = document.getElementById("size").value;
    const murtiType = document.getElementById("murtiType").value.trim();

    if (!name || !phone || !material || !size || !murtiType) {
      alert("Please fill in all fields.");
      return;
    }

    phone = phone.replace(/[^0-9]/g, '');

    // Get current local date & time automatically
    const now = new Date();
    const dateString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    const enquiries = getSavedEnquiries();
    
    // Add new entry at the beginning (newest first)
    enquiries.unshift({ name, phone, material, size, murtiType, dateString });

    localStorage.setItem("lambodarEnquiries", JSON.stringify(enquiries));

    loadEnquiries();
    document.getElementById("enquiryForm").reset();
    document.getElementById("searchInput").value = "";
  }

  function deleteEnquiry(index) {
    if (confirm("Are you sure you want to delete this enquiry?")) {
      const enquiries = getSavedEnquiries();
      enquiries.splice(index, 1);
      localStorage.setItem("lambodarEnquiries", JSON.stringify(enquiries));
      loadEnquiries();
    }
  }

  function filterEnquiries() {
    const query = document.getElementById("searchInput").value.toLowerCase();
    const enquiries = getSavedEnquiries();

    const filtered = enquiries.filter(item => {
      return item.name.toLowerCase().includes(query) || item.phone.includes(query);
    });

    renderTable(filtered);
  }

  function exportToCSV() {
    const enquiries = getSavedEnquiries();
    if (enquiries.length === 0) {
      alert("No enquiry data available to export!");
      return;
    }

    let csvContent = "data:text/csv;charset=utf-8,Date,Name,Phone,Material,Size,Details\n";
    enquiries.forEach(item => {
      csvContent += `"${item.dateString}","${item.name}","+${item.phone}","${item.material}","${item.size}","${item.murtiType}"\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Lambodar_Enquiries_2026.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }
</script>

</body>
</html>
