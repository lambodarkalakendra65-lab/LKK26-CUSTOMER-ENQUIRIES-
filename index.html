<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambodar Kala Kendra - Bookings & Payment System</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-orange: #ff6f00;
            --deep-saffron: #e65100;
            --accent-yellow: #ffab00;
            --maroon-red: #880e4f;
            --bg-cream: #fff8e1;
            --text-dark: #3e2723;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 12px;
        }

        .container { max-width: 1150px; margin: 0 auto; }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--deep-saffron), var(--maroon-red));
            color: white;
            padding: 15px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 { margin: 0; font-size: 1.6rem; }
        header p { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--accent-yellow); }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border-top: 4px solid var(--primary-orange);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--maroon-red);
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 6px;
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--deep-saffron);
            margin: 10px 0 8px 0;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) { .form-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 900px) { .form-grid { grid-template-columns: repeat(3, 1fr); } }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: 600; margin-bottom: 4px; font-size: 0.85rem; }

        .form-group input, .form-group select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 111, 0, 0.2);
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; }
        @media (min-width: 600px) { .btn-group { flex-direction: row; } }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
        }

        @media (min-width: 600px) { button { width: auto; } }

        .btn-add { background-color: var(--primary-orange); color: white; }
        .btn-excel { background-color: #2e7d32; color: white; }
        @media (min-width: 600px) { .btn-excel { margin-left: auto; } }

        .search-container { margin-bottom: 12px; }
        .search-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary-orange);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .table-responsive {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: var(--maroon-red); color: white; padding: 12px 8px; font-size: 0.8rem; }
        td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 0.8rem; }

        @media (max-width: 850px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { border: 1px solid #ffd54f; border-radius: 10px; margin: 10px; padding: 10px; background: #fff8e1; }
            td { border: none; position: relative; padding-left: 45%; text-align: right; padding-top: 5px; padding-bottom: 5px; }
            td:before { position: absolute; top: 5px; left: 10px; width: 40%; text-align: left; font-weight: bold; color: var(--maroon-red); content: attr(data-label); }
            .action-td { padding-left: 10px !important; text-align: center !important; margin-top: 8px; border-top: 1px solid #ffe082 !important; padding-top: 8px !important; }
            .action-td:before { display: none; }
        }

        .action-btns { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
        .btn-edit { background-color: #0288d1; color: white; padding: 6px 8px; font-size: 0.75rem; }
        .btn-receipt { background-color: #25d366; color: white; padding: 6px 8px; font-size: 0.75rem; }
        .btn-delete { background-color: #d32f2f; color: white; padding: 6px 8px; font-size: 0.75rem; }

        .badge-paid { background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 10px; font-weight: bold; font-size: 0.7rem; }
        .badge-pending { background: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 10px; font-weight: bold; font-size: 0.7rem; }
        
        #loading { text-align: center; padding: 15px; font-weight: bold; color: var(--deep-saffron); display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Lambodar Kala Kendra 🌸</h1>
        <p>Live Booking & Digital Payment Receipt System</p>
    </header>

    <div class="card">
        <h2 id="form-title">➕ New Customer Booking & Enquiry</h2>
        <input type="hidden" id="edit-id" value="">
        
        <div class="section-title">👤 Customer & Murti Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="custName">Customer Name</label>
                <input type="text" id="custName" placeholder="Customer ka naam">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Mobile number">
            </div>

            <div class="form-group">
                <label for="material">Material Type</label>
                <select id="material">
                    <option value="Eco-Friendly (Shadu Mati)">Eco-Friendly (Shadu Mati)</option>
                    <option value="POP (Plaster of Paris)">POP (Plaster of Paris)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="size">Size (in Feet)</label>
                <select id="size"></select>
            </div>

            <div class="form-group">
                <label for="style">Murti Style</label>
                <input type="text" id="style" placeholder="e.g. Dagdusheth, Lalbaug">
            </div>
        </div>

        <div class="section-title">💳 Payment Details (UPI / Cash)</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="totalPrice">Total Amount (₹)</label>
                <input type="number" id="totalPrice" placeholder="Total Price" oninput="calculateBalance()">
            </div>

            <div class="form-group">
                <label for="advancePaid">Advance Paid (₹)</label>
                <input type="number" id="advancePaid" placeholder="Advance Amount" oninput="calculateBalance()">
            </div>

            <div class="form-group">
                <label for="balanceAmount">Remaining Balance (₹)</label>
                <input type="number" id="balanceAmount" placeholder="Balance Amount" readonly style="background-color: #f5f5f5;">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-add" id="save-btn" onclick="saveEnquiry()">💾 Save Booking</button>
            <button class="btn-excel" onclick="exportToExcel()">📊 Backup to Excel</button>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search Customer Name or Mobile Number..." onkeyup="filterEnquiries()">
    </div>

    <div class="table-responsive">
        <div id="loading">Data Processing... 🔄</div>
        <table>
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Date & Time</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Type / Size</th>
                    <th>Style</th>
                    <th>Total (₹)</th>
                    <th>Advance (₹)</th>
                    <th>Balance (₹)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="enquiry-list"></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCI1k4bvmPUhkWh1-HOHsoL8LOaV8elus3NgWLF8tqBLd5fOeB21zXFT3r7v2p9NdI/exec";

    const sizeSelect = document.getElementById('size');
    for (let i = 1.0; i <= 10.0; i += 0.5) {
        let option = document.createElement('option');
        option.value = `${i.toFixed(1)} ft`;
        option.textContent = `${i.toFixed(1)} ft`;
        sizeSelect.appendChild(option);
    }

    let enquiries = [];

    function calculateBalance() {
        const total = parseFloat(document.getElementById('totalPrice').value) || 0;
        const advance = parseFloat(document.getElementById('advancePaid').value) || 0;
        const balance = total - advance;
        document.getElementById('balanceAmount').value = balance >= 0 ? balance : 0;
    }

    // Clean Date & Time Formatter
    function getFormattedDateTime() {
        const now = new Date();
        const optionsDate = { day: '2-digit', month: 'short', year: 'numeric' };
        const optionsTime = { hour: '2-digit', minute: '2-digit', hour12: true };
        return `${now.toLocaleDateString('en-GB', optionsDate)}, ${now.toLocaleTimeString('en-US', optionsTime)}`;
    }

    async function loadData() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
            enquiries = await res.json();
            renderTable(enquiries);
        } catch(e) {
            console.error("Error loading data:", e);
        }
        document.getElementById('loading').style.display = 'none';
    }

    function renderTable(dataToRender) {
        const tbody = document.getElementById('enquiry-list');
        tbody.innerHTML = '';

        if (!dataToRender || dataToRender.length === 0) {
            tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding: 20px;">Koi booking record nahi hai.</td></tr>`;
            return;
        }

        dataToRender.forEach((item, index) => {
            const row = document.createElement('tr');
            const originalIndex = enquiries.findIndex(e => e.id == item.id);
            const balanceVal = item.balance || 0;
            const statusBadge = balanceVal == 0 && item.total > 0 
                ? `<span class="badge-paid">FULL PAID</span>` 
                : `<span class="badge-pending">BAL: ₹${balanceVal}</span>`;

            row.innerHTML = `
                <td data-label="Sr. No."><b>${index + 1}</b></td>
                <td data-label="Date & Time">${item.datetime || ''}</td>
                <td data-label="Customer Name"><b>${item.name || ''}</b></td>
                <td data-label="Phone">${item.phone || ''}</td>
                <td data-label="Type / Size">${item.material || ''} (${item.size || ''})</td>
                <td data-label="Style">${item.style || ''}</td>
                <td data-label="Total (₹)">₹${item.total || 0}</td>
                <td data-label="Advance (₹)">₹${item.advance || 0}</td>
                <td data-label="Balance (₹)">${statusBadge}</td>
                <td class="action-td">
                    <div class="action-btns">
                        <button class="btn-receipt" onclick="sendWhatsAppReceipt(${originalIndex})">🧾 Receipt</button>
                        <button class="btn-edit" onclick="editEnquiry(${originalIndex})">✏️ Edit</button>
                        <button class="btn-delete" onclick="deleteEnquiry(${originalIndex})">🗑️</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function filterEnquiries() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!query) {
            renderTable(enquiries);
            return;
        }

        const filtered = enquiries.filter(item => {
            const nameMatch = item.name && item.name.toLowerCase().includes(query);
            const phoneMatch = item.phone && String(item.phone).toLowerCase().includes(query);
            return nameMatch || phoneMatch;
        });

        renderTable(filtered);
    }

    async function saveEnquiry() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const material = document.getElementById('material').value;
        const size = document.getElementById('size').value;
        const style = document.getElementById('style').value.trim();
        const total = parseFloat(document.getElementById('totalPrice').value) || 0;
        const advance = parseFloat(document.getElementById('advancePaid').value) || 0;
        const balance = parseFloat(document.getElementById('balanceAmount').value) || 0;
        const editId = document.getElementById('edit-id').value;

        if (!name || !phone || !style) {
            alert('Kripya Name, Phone aur Style zaroor bharein!');
            return;
        }

        document.getElementById('loading').style.display = 'block';

        let payload = {};
        if (!editId) {
            payload = { 
                action: "add", 
                datetime: getFormattedDateTime(), 
                name, phone, material, size, style, total, advance, balance 
            };
        } else {
            payload = { 
                action: "update", 
                id: editId, 
                name, phone, material, size, style, total, advance, balance 
            };
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(e) {
            console.error("Save error:", e);
        }

        resetForm();
        setTimeout(loadData, 1200);
    }

    function editEnquiry(index) {
        if(index === -1) return;
        const item = enquiries[index];
        document.getElementById('custName').value = item.name;
        document.getElementById('phone').value = item.phone;
        document.getElementById('material').value = item.material;
        document.getElementById('size').value = item.size;
        document.getElementById('style').value = item.style;
        document.getElementById('totalPrice').value = item.total || 0;
        document.getElementById('advancePaid').value = item.advance || 0;
        document.getElementById('balanceAmount').value = item.balance || 0;
        
        document.getElementById('edit-id').value = item.id;
        
        document.getElementById('save-btn').textContent = "🔄 Update Booking";
        document.getElementById('form-title').textContent = "✏️ Edit Booking Details";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteEnquiry(index) {
        if(index === -1) return;
        if (confirm("Kya aap ye booking record delete karna chahte hain?")) {
            const item = enquiries[index];
            document.getElementById('loading').style.display = 'block';
            
            try {
                // Delete using Unique ID
                const deleteUrl = `${SCRIPT_URL}?action=delete&id=${encodeURIComponent(item.id)}`;
                await fetch(deleteUrl);
            } catch(e) {
                console.error("Delete error:", e);
            }

            setTimeout(loadData, 1200);
        }
    }

    function resetForm() {
        document.getElementById('custName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('style').value = '';
        document.getElementById('totalPrice').value = '';
        document.getElementById('advancePaid').value = '';
        document.getElementById('balanceAmount').value = '';
        document.getElementById('material').selectedIndex = 0;
        document.getElementById('size').selectedIndex = 0;
        document.getElementById('edit-id').value = "";
        document.getElementById('save-btn').textContent = "💾 Save Booking";
        document.getElementById('form-title').textContent = "➕ New Customer Booking & Enquiry";
    }

    function sendWhatsAppReceipt(index) {
        if(index === -1) return;
        const item = enquiries[index];
        let cleanPhone = String(item.phone).replace(/\D/g, '');
        if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

        const statusText = item.balance == 0 && item.total > 0 ? "FULL PAID ✅" : "ADVANCE PAID 🟡";

        const message = `🌸 *LAMBODAR KALA KENDRA* 🌸%0A` +
            `📍 *Booking Receipt & Confirmation*%0A` +
            `----------------------------------------%0A` +
            `👤 *Customer Name:* ${item.name}%0A` +
            `📱 *Phone:* ${item.phone}%0A` +
            `📅 *Date:* ${item.datetime}%0A%0A` +
            `🛕 *MURTI DETAILS:*%0A` +
            `• *Material:* ${item.material}%0A` +
            `• *Size:* ${item.size}%0A` +
            `• *Style:* ${item.style}%0A%0A` +
            `💳 *PAYMENT SUMMARY:*%0A` +
            `• *Total Price:* ₹${item.total}%0A` +
            `• *Advance Paid:* ₹${item.advance}%0A` +
            `• *Remaining Balance:* ₹${item.balance}%0A` +
            `• *Status:* ${statusText}%0A` +
            `----------------------------------------%0A` +
            `Aapki booking successfully ho gayi hai!%0A` +
            `Ganpati Bappa Morya! 🚩🌸`;

        window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
    }

    function exportToExcel() {
        if (!enquiries || enquiries.length === 0) {
            alert("Export karne ke liye koi data nahi hai!");
            return;
        }

        const excelData = enquiries.map((item, idx) => ({
            "Sr. No.": idx + 1,
            "Date & Time": item.datetime,
            "Customer Name": item.name,
            "Phone Number": item.phone,
            "Material": item.material,
            "Size": item.size,
            "Murti Style": item.style,
            "Total Price": item.total,
            "Advance Paid": item.advance,
            "Balance Amount": item.balance
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Bookings");
        XLSX.writeFile(workbook, "Lambodar_Kala_Kendra_Bookings.xlsx");
    }

    loadData();
</script>
</body>
</html>
