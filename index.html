<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambodar Kala Kendra - Enquiries & Bookings</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-orange: #ff6f00;
            --deep-saffron: #e65100;
            --accent-yellow: #ffab00;
            --maroon-red: #880e4f;
            --bg-cream: #fff8e1;
            --text-dark: #3e2723;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            background: linear-gradient(135deg, var(--deep-saffron), var(--maroon-red));
            color: white;
            padding: 15px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        header h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            color: var(--accent-yellow);
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border-top: 4px solid var(--primary-orange);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 15px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: var(--maroon-red);
            border-bottom: 2px solid var(--accent-yellow);
            padding-bottom: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .form-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 0.85rem;
        }

        .form-group input, .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 111, 0, 0.2);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 600px) {
            .btn-group {
                flex-direction: row;
            }
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            transition: background-color 0.2s ease;
        }

        @media (min-width: 600px) {
            button {
                width: auto;
            }
        }

        .btn-add { background-color: var(--primary-orange); color: white; }
        .btn-add:active { background-color: var(--deep-saffron); }

        .btn-excel { background-color: #2e7d32; color: white; }
        @media (min-width: 600px) {
            .btn-excel { margin-left: auto; }
        }

        .table-responsive {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: var(--maroon-red);
            color: white;
            padding: 12px 10px;
            font-size: 0.85rem;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                border: 1px solid #ffd54f;
                border-radius: 10px;
                margin: 10px;
                padding: 10px;
                background: #fff8e1;
            }

            td {
                border: none;
                position: relative;
                padding-left: 45%;
                text-align: right;
                padding-top: 6px;
                padding-bottom: 6px;
            }

            td:before {
                position: absolute;
                top: 6px;
                left: 10px;
                width: 40%;
                text-align: left;
                font-weight: bold;
                color: var(--maroon-red);
                content: attr(data-label);
            }

            .action-td {
                padding-left: 10px !important;
                text-align: center !important;
                margin-top: 10px;
                border-top: 1px solid #ffe082 !important;
                padding-top: 10px !important;
            }

            .action-td:before {
                display: none;
            }

            .action-btns {
                display: flex;
                gap: 8px;
            }

            .action-btns button {
                flex: 1;
                padding: 8px 4px;
                font-size: 0.8rem;
            }
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit { background-color: #0288d1; color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-wa { background-color: #25d366; color: white; padding: 6px 10px; font-size: 0.8rem; }
        .btn-delete { background-color: #d32f2f; color: white; padding: 6px 10px; font-size: 0.8rem; }

        .badge-eco { background: #e8f5e9; color: #2e7d32; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; }
        .badge-pop { background: #ffebee; color: #c62828; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 0.75rem; }
        
        #loading {
            text-align: center;
            padding: 15px;
            font-weight: bold;
            color: var(--deep-saffron);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🌸 Lambodar Kala Kendra 🌸</h1>
        <p>Live Cloud Booking System</p>
    </header>

    <div class="card">
        <h2 id="form-title">➕ New Customer Enquiry</h2>
        <input type="hidden" id="edit-index" value="-1">
        <input type="hidden" id="edit-datetime" value="">
        <input type="hidden" id="edit-oldname" value="">
        
        <div class="form-grid">
            <div class="form-group">
                <label for="custName">Customer Name</label>
                <input type="text" id="custName" placeholder="Customer ka naam">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Mobile number">
            </div>

            <div class="form-group">
                <label for="material">Material Type</label>
                <select id="material">
                    <option value="Eco-Friendly (Shadu Mati)">Eco-Friendly (Shadu Mati)</option>
                    <option value="POP (Plaster of Paris)">POP (Plaster of Paris)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="size">Size (in Feet)</label>
                <select id="size"></select>
            </div>

            <div class="form-group">
                <label for="style">Murti Style</label>
                <input type="text" id="style" placeholder="e.g. Dagdusheth, Lalbaug">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn-add" id="save-btn" onclick="saveEnquiry()">💾 Save Entry</button>
            <button class="btn-excel" onclick="exportToExcel()">📊 Backup to Excel</button>
        </div>
    </div>

    <div class="table-responsive">
        <div id="loading">Data Load Ho Raha Hai... 🔄</div>
        <table>
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Date & Time</th>
                    <th>Customer Name</th>
                    <th>Phone</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Style</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="enquiry-list"></tbody>
        </table>
    </div>
</div>

<script>
    // AAPKA NAYA GOOGLE SCRIPT URL LINE 228 PAR UPDATE KAR DIYA GAYA HAI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCI1k4bvmPUhkWh1-HOHsoL8LOaV8elus3NgWLF8tqBLd5fOeB21zXFT3r7v2p9NdI/exec";

    const sizeSelect = document.getElementById('size');
    for (let i = 1.0; i <= 10.0; i += 0.5) {
        let option = document.createElement('option');
        option.value = `${i.toFixed(1)} ft`;
        option.textContent = `${i.toFixed(1)} ft`;
        sizeSelect.appendChild(option);
    }

    let enquiries = [];

    async function loadData() {
        document.getElementById('loading').style.display = 'block';
        try {
            const res = await fetch(SCRIPT_URL);
            enquiries = await res.json();
            renderTable();
        } catch(e) {
            console.error("Error loading data:", e);
            renderOfflineData();
        }
        document.getElementById('loading').style.display = 'none';
    }

    function renderOfflineData() {
        enquiries = JSON.parse(localStorage.getItem('lambodar_enquiries')) || [];
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('enquiry-list');
        tbody.innerHTML = '';

        if (!enquiries || enquiries.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 20px;">Koi enquiry recorded nahi hai.</td></tr>`;
            return;
        }

        enquiries.forEach((item, index) => {
            const badgeClass = (item.material && item.material.includes('Eco')) ? 'badge-eco' : 'badge-pop';
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td data-label="Sr. No."><b>${index + 1}</b></td>
                <td data-label="Date & Time">${item.datetime || ''}</td>
                <td data-label="Customer Name">${item.name || ''}</td>
                <td data-label="Phone">${item.phone || ''}</td>
                <td data-label="Type"><span class="${badgeClass}">${item.material || ''}</span></td>
                <td data-label="Size">${item.size || ''}</td>
                <td data-label="Style">${item.style || ''}</td>
                <td class="action-td">
                    <div class="action-btns">
                        <button class="btn-wa" onclick="sendWhatsApp(${index})">💬 WhatsApp</button>
                        <button class="btn-edit" onclick="editEnquiry(${index})">✏️ Edit</button>
                        <button class="btn-delete" onclick="deleteEnquiry(${index})">🗑️</button>
                    </div>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function saveEnquiry() {
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const material = document.getElementById('material').value;
        const size = document.getElementById('size').value;
        const style = document.getElementById('style').value.trim();
        const editIndex = parseInt(document.getElementById('edit-index').value);

        if (!name || !phone || !style) {
            alert('Kripya saari details bharein!');
            return;
        }

        const now = new Date();
        const datetime = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        document.getElementById('loading').style.display = 'block';

        let payload = {};
        if (editIndex === -1) {
            payload = { action: "add", datetime, name, phone, material, size, style };
        } else {
            const oldDatetime = document.getElementById('edit-datetime').value;
            const oldName = document.getElementById('edit-oldname').value;
            payload = { action: "update", oldDatetime, oldName, name, phone, material, size, style };
        }

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
        } catch(e) {
            alert("Connection error! Kripya dobara try karein.");
        }

        resetForm();
        await loadData();
    }

    function editEnquiry(index) {
        const item = enquiries[index];
        document.getElementById('custName').value = item.name;
        document.getElementById('phone').value = item.phone;
        document.getElementById('material').value = item.material;
        document.getElementById('size').value = item.size;
        document.getElementById('style').value = item.style;
        
        document.getElementById('edit-index').value = index;
        document.getElementById('edit-datetime').value = item.datetime;
        document.getElementById('edit-oldname').value = item.name;
        
        document.getElementById('save-btn').textContent = "🔄 Update Entry";
        document.getElementById('form-title').textContent = "✏️ Edit Customer Enquiry";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteEnquiry(index) {
        if (confirm("Kya aap ye enquiry delete karna chahte hain?")) {
            const item = enquiries[index];
            document.getElementById('loading').style.display = 'block';
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "delete", datetime: item.datetime, name: item.name })
            });
            await loadData();
        }
    }

    function resetForm() {
        document.getElementById('custName').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('style').value = '';
        document.getElementById('material').selectedIndex = 0;
        document.getElementById('size').selectedIndex = 0;
        document.getElementById('edit-index').value = "-1";
        document.getElementById('save-btn').textContent = "💾 Save Entry";
        document.getElementById('form-title').textContent = "➕ New Customer Enquiry";
    }

    function sendWhatsApp(index) {
        const item = enquiries[index];
        let cleanPhone = String(item.phone).replace(/\D/g, '');
        if (cleanPhone.length === 10) cleanPhone = '91' + cleanPhone;

        const message = `Namaste ${item.name} ji! 🙏%0A%0A` +
            `*Lambodar Kala Kendra* me aapka swagat hai! 🌸%0A%0A` +
            `Aapki Ganpati Bappa Murti enquiry details:%0A` +
            `▫️ *Material:* ${item.material}%0A` +
            `▫️ *Size:* ${item.size}%0A` +
            `▫️ *Style:* ${item.style}%0A%0A` +
            `Booking finalize karne ke liye is message ka reply karein. Ganpati Bappa Morya! 🚩`;

        window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
    }

    function exportToExcel() {
        if (!enquiries || enquiries.length === 0) {
            alert("Export karne ke liye koi data nahi hai!");
            return;
        }

        const excelData = enquiries.map((item, idx) => ({
            "Sr. No.": idx + 1,
            "Date & Time": item.datetime,
            "Customer Name": item.name,
            "Phone Number": item.phone,
            "Material": item.material,
            "Size": item.size,
            "Murti Style": item.style
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "Enquiries");
        XLSX.writeFile(workbook, "Lambodar_Kala_Kendra_Enquiries.xlsx");
    }

    loadData();
</script>
</body>
</html>
